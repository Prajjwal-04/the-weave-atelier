<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED59B"/>
      <stop offset="35%" stop-color="#C59E50"/>
      <stop offset="70%" stop-color="#936D23"/>
      <stop offset="100%" stop-color="#D7B56E"/>
    </linearGradient>
    <radialGradient id="innerBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="85%" stop-color="#ECE5DA"/>
      <stop offset="100%" stop-color="#DED4C5"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A7426"/>
      <stop offset="50%" stop-color="#C59E50"/>
      <stop offset="100%" stop-color="#735213"/>
    </linearGradient>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0.5" dy="0.8" stdDeviation="0.4" flood-color="#553A08" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Circular Gold Medallion Rim -->
  <circle cx="32" cy="32" r="30.5" stroke="url(#goldRim)" stroke-width="2.2" fill="url(#innerBg)"/>
  <circle cx="32" cy="32" r="28.5" stroke="url(#goldRim)" stroke-width="0.7" fill="none" opacity="0.6"/>

  <!-- Stylized Luxury PR Monogram with Artisanal Flourish Wave -->
  <!-- Letter P -->
  <path d="M20 18 H28 C32.5 18 35.5 20.8 35.5 25 C35.5 29.2 32.5 32 28 32 H22.5 V46 H20 V18 Z M22.5 29.8 H27.5 C30.8 29.8 32.8 27.8 32.8 25 C32.8 22.2 30.8 20.2 27.5 20.2 H22.5 V29.8 Z" fill="url(#goldText)" filter="url(#emboss)"/>
  
  <!-- Letter R Interlocked -->
  <path d="M33 30.5 C35.5 30.5 37.8 31.8 39.2 34 L45 46 H41.8 L36.5 35 C35.5 33.2 34 32.5 32 32.5 V46 H29.8 V30.5 H33 Z" fill="url(#goldText)" filter="url(#emboss)"/>

  <!-- Signature Atelier Weave Swash Line -->
  <path d="M16 31.5 C24 33.5 38 27.5 48 31.2 C42 32.5 28 34.5 16 31.5 Z" fill="url(#goldRim)"/>
  
  <!-- Subtitle Dot & Arc -->
  <circle cx="32" cy="51" r="1.2" fill="url(#goldText)"/>
  <path d="M22 51 H28 M36 51 H42" stroke="url(#goldText)" stroke-width="0.7" stroke-linecap="round"/>
</svg>
